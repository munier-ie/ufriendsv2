  <style>
    body { margin: 0; background-color: #f3fcfd; }
    .initial-loader-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(30, 144, 255, 0.2);
      border-top-color: #004687;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-phrases {
      position: relative;
      height: 24px;
      width: 100%;
      margin-top: 20px;
      overflow: hidden;
    }
    .phrase {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      text-align: center;
      color: #004687;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.5px;
      opacity: 0;
    }
    .phrase:nth-child(1) { animation: cycle-step 2s forwards 0s; }
    .phrase:nth-child(2) { animation: cycle-step 2s forwards 2s; }
    .phrase:nth-child(3) { animation: cycle-step 2s forwards 4s; }
    .phrase:nth-child(4) { animation: cycle-step 2s forwards 6s; }
    .phrase:nth-child(5) { animation: cycle-step 2s forwards 8s; }
    .phrase:nth-child(6) { animation: cycle-step 2s forwards 10s; }
    .phrase:nth-child(7) { animation: cycle-step 2s forwards 12s; }
    .phrase:nth-child(8) { animation: phrase-stay-final 0.5s forwards 14s; }

    @keyframes cycle-step {
      0% { opacity: 0; transform: translateY(10px); }
      15%, 85% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-10px); }
    }

    @keyframes phrase-stay-final {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="initial-loader-wrapper">
      <div class="spinner"></div>
      <div class="loading-phrases">
        <div class="phrase">Connecting to UFriends IT...</div>
        <div class="phrase">Fetching best data deals...</div>
        <div class="phrase">Loading BVN & NIN services...</div>
        <div class="phrase">Preparing NIN & BVN slips...</div>
        <div class="phrase">Setting up bill payments & business registration...</div>
        <div class="phrase">Loading WAEC, NECO & JAMB PINs...</div>
        <div class="phrase">Almost ready...</div>
        <div class="phrase">Welcome to UFriends IT!</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
