name: mobile
description: "Ufriends IT Mobile App — Buy Cheap Data, Airtime & Government Identity Services in Nigeria."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  flutter_colorpicker: ^1.1.0
  google_fonts: ^8.1.0
  shimmer: ^3.0.0
  flutter_local_notifications: ^21.0.0
  flutter_svg: ^2.2.4
  http: ^1.6.0
  shared_preferences: ^2.5.5
  share_plus: ^13.1.0
  path_provider: ^2.1.5
  fl_chart: ^1.2.0
  fluentui_system_icons: ^1.1.273
  permission_handler: ^12.0.1
  flutter_native_contact_picker: ^0.0.8
  connectivity_plus: ^6.1.4
  image_picker: ^1.2.2
  url_launcher: ^6.3.2
  intl: ^0.20.2
  font_awesome_flutter: ^11.0.0
  pinput: ^6.0.2
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo.png
  android_12:
    image: assets/images/logo.png
    color: "#ffffff"
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/ISPlogo/
    - assets/images/cable_tv/
    - assets/images/electricity/
    - assets/images/exam/
    - assets/slip_samples/
